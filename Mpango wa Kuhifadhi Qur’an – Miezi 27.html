else if(t.id=="pk"){$("bk").innerHTML=`<div style="margin-top:8px;font-size:12.5px;color:var(--mu)">Nakili msimbo huu uuhifadhi (Notes au WhatsApp). Ukibadili simu, bandika hapa chini kurejesha.</div><textarea id="bc" readonly rows="3">${mkcode()}</textarea><textarea id="br" rows="2" placeholder="Bandika msimbo hapa kurejesha"></textarea><button class="go" id="brs">Rejesha</button>`;}
else if(t.id=="brs"){try{const o=JSON.parse(decodeURIComponent(escape(atob($("br").value.trim()))));st=o.st||{};dt=o.dt||{};start=o.start||"";pf=o.pf||{n:"",q:""};saveAll();$("sd").value=start;me();render();}catch(x){$("br").value="";$("br").placeholder="Msimbo si sahihi";}}
};
let tm="blue";try{tm=localStorage.getItem("q27t")||"blue";}catch(e){}
const TH=[["green","Kijani","#f7f5f0","#3f6b1d"],["black","Nyeusi","#000","#fff"],["white","Nyeupe","#fff","#111"],["gold","Dhahabu","#14110a","#d4af37"],["cream","Krimu","#f6efe0","#9a6b2f"],["blue","Bluu ya usiku","#0c1424","#6fa8ff"]];
$("pan").innerHTML=`<div class="bl">`+TH.map((x,k)=>`<button class="pt" data-t="${x[0]}" title="${x[1]}" aria-label="${x[1]}" style="--r:${k*60}deg;transition-delay:${k*50}ms;background:radial-gradient(circle at 50% 22%,rgba(255,255,255,.4),transparent 48%),linear-gradient(to bottom,${x[3]},${x[2]})"></button>`).join("")+`</div><div class="ct"><small>Mandhari</small><b id="ctn"></b></div>`;
function themeSet(t,q){tm=t;document.documentElement.dataset.theme=t;try{localStorage.setItem("q27t",t);}catch(e){}if(!q)touch(1);const x=TH.find(y=>y[0]==t)||TH[0];$("fb").textContent="🎨 Mandhari: "+x[1];$("ctn").textContent=x[1];document.querySelectorAll(".pt").forEach(b=>b.classList.toggle("on",b.dataset.t==t));}
$("th").onclick=e=>{const p=e.target.closest(".pt");if(p){themeSet(p.dataset.t);setTimeout(()=>$("th").classList.remove("open"),250);return;}if(e.target.closest("#fb"))$("th").classList.toggle("open");};
document.addEventListener("click",e=>{if(!$("th").contains(e.target))$("th").classList.remove("open");});
let CL=null,ctm=0,cd=false,mn=false,LT=0,dirty=false;
function cs(k){const e=$("cs");if(e)e.textContent=k===1?"☁️ Imehifadhiwa kwenye akaunti":k===0?"⚠️ Akaunti haikuhifadhi (simu hii tu)":"📱 Simu hii tu";}
function push(){if(!CL)return;dirty=false;clearTimeout(ctm);try{CL.set({st,dt,start,pf,tm,ts:LT||Date.now()}).then(()=>cs(1),()=>cs(0));}catch(e){cs(0);}}
function touch(now){LT=Date.now();try{localStorage.setItem("q27ts",String(LT));}catch(e){}dirty=true;if(!CL)return;clearTimeout(ctm);if(now)push();else ctm=setTimeout(push,500);}
addEventListener("visibilitychange",()=>{if(document.hidden&&dirty)push();});
addEventListener("pagehide",()=>{if(dirty)push();});
function fin(){const s=$("sp");if(cd&&mn&&s){s.classList.add("out");setTimeout(()=>s.remove(),700);}}
async function cloudInit(){try{if(!window.claude)return;const u=await claude.use("user"),db=await claude.use("db");const id=u?await u.id():null;if(!db||!id)return;const ref=db.collection("data/users/"+id).doc("state");const s=await ref.get();CL=ref;cs(1);let l=0;try{l=+localStorage.getItem("q27ts")||0;}catch(e){}
if(s.exists){const c=JSON.parse(JSON.stringify(s.data()));if((c.ts||0)>l){st=c.st||{};dt=c.dt||{};start=c.start||"";pf=c.pf||{n:"",q:""};if(c.tm)tm=c.tm;try{localStorage.setItem("q27",JSON.stringify(st));localStorage.setItem("q27d",JSON.stringify(dt));localStorage.setItem("q27s",start);localStorage.setItem("q27p",JSON.stringify(pf));localStorage.setItem("q27ts",String(c.ts));}catch(e){}themeSet(tm,1);$("sd").value=start;if($("sg")&&pf.n)$("sg").textContent="Karibu, "+pf.n;dirty=false;render();me();}else if((c.ts||0)<l)touch(1);}
else if(l||pf.n||Object.keys(st).length)touch(1);if(dirty)push();}catch(e){cs(0);}finally{cd=true;fin();}}
const sel={};
function NX(){for(let i=0;i<N;i++)if(!done(i))return i;return -1;}
function url(b,n){const q=encodeURIComponent(b==1?"سورة "+n+" تلاوة مجودة":b==16?"سبب نزول سورة "+n:b==32?"فضل سورة "+n+" وفضل قراءتها":"التفسير الميسر سورة "+n);return b==1?"https://www.youtube.com/results?search_query="+q:"https://www.google.com/search?q="+q;}
function chip(i,b,t,v){const on=v&b?" on":"";if(b<4)return `<a class="chip${on}" data-i="${i}" data-b="${b}" href="${url(b,days[i].a[sel[i]||0])}" target="_blank" rel="noopener">${t}</a>`;return `<button class="chip${on}" data-i="${i}" data-b="${b}">${t}</button>`;}
function rng(d){if(d.sp)return "Sura nzima";if(d.f==1&&d.t==0)return "Sura nzima";if(d.t==0)return "Aya "+d.f+" – mwisho";return "Aya "+d.f+" – "+d.t;}
function mcount(m){let c=0,e=Math.min(m*30+30,N);for(let i=m*30;i<e;i++)if(done(i))c++;return c;}
function tabs(){const T=todayIdx();$("tabs").innerHTML=Array.from({length:M},(_,m)=>{const e=Math.min(m*30+30,N)-m*30;return `<button class="tab${m==cur?" on":""}${mcount(m)==e?" full":""}" data-m="${m}">${m+1}</button>`}).join("");}
function stats(){let c=0;for(let i=0;i<N;i++)if(done(i))c++;const p=Math.round(c/N*100);$("pc").textContent=p+"%";$("pt").textContent=" · siku "+c+" kati ya "+N+" zimekamilika";$("pb").style.width=p+"%";
const T=todayIdx(),rem=N-c,td=today();let tc=0;for(const k in dt)if(dt[k]===td&&done(+k))tc++;
const a=["Zimebaki siku "+rem+" kati ya "+N];
if(T>=0&&T<N){const d=c-(T+1);a.push(d>0?"🚀 Uko mbele kwa siku "+d:d<0?"⏳ Uko nyuma kwa siku "+(-d):"✅ Uko sawa na ratiba");}else if(!start)a.push("Weka tarehe uliyoanza kuona kama uko mbele au nyuma.");
if(tc>0)a.push("Leo umehifadhi siku "+tc);
if(rem>0){const f=new Date();f.setDate(f.getDate()+rem);a.push("Kumaliza (siku 1 kwa siku): "+f.toLocaleDateString("sw",{day:"numeric",month:"short",year:"numeric"}));}else a.push("Hongera, umemaliza! 🎉");
$("tl").innerHTML=a.map(x=>"<div>"+x+"</div>").join("");}
function render(){const T=todayIdx(),s=cur*30,e=Math.min(s+30,N);
$("mt").textContent="Mwezi wa "+(cur+1);$("mp").textContent=mcount(cur)+"/"+(e-s)+" siku";
let h="";for(let i=s;i<e;i++){const d=days[i],v=st[i]||0;
h+=`<div class="day${v&4?" done":""}${i==NX()?" today":""}" id="d${i}"><div class="top"><div class="no">${i-s+1}</div><div class="nm">${d.n}</div><div class="rg">${rng(d)}</div></div>`+(d.a.length>1?`<div class="sns">${d.a.map((x,k)=>`<button class="sn${(sel[i]||0)==k?" on":""}" data-s="${i}:${k}">${x}</button>`).join("")}</div>`:"")+
(d.f>1?`<div class="rb">Rabt (kuunganisha): aya 1 – ${d.f-1}</div>`:"")+
`<div class="chips">${L.map(([b,t])=>chip(i,b,t,v)).join("")}${[[16,"📜 Sababu ya kushuka"],[32,"⭐ Fadhila ya sura"]].map(([b,t])=>`<a class="chip lk" href="${url(b,days[i].a[sel[i]||0])}" target="_blank" rel="noopener">${t}</a>`).join("")}</div></div>`;}
$("list").innerHTML=h;tabs();stats();}
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;cur=+b.dataset.m;render();scrollTo(0,0);};
$("list").onclick=e=>{const sn=e.target.closest(".sn");if(sn){const[j,k]=sn.dataset.s.split(":");sel[j]=+k;const y0=scrollY;render();scrollTo(0,y0);return;}const b=e.target.closest(".chip");if(!b||b.classList.contains("lk"))return;const i=+b.dataset.i;st[i]=(st[i]||0)^(+b.dataset.b);if(+b.dataset.b==4){if(st[i]&4)dt[i]=today();else delete dt[i];}save();if(b.tagName=="A"){b.classList.toggle("on");return;}
const y=scrollY;render();scrollTo(0,y);};
$("sd").value=start;
$("sd").onchange=()=>{start=$("sd").value;try{localStorage.setItem("q27s",start);}catch(e){}touch();render();};
$("td").onclick=()=>{const T=NX();if(T<0)return;cur=Math.floor(T/30);render();const el=$("d"+T);if(el)el.scrollIntoView({block:"center"});};
(function(){const T=NX();if(T>0)cur=Math.floor(T/30);render();me();themeSet(tm,1);if(pf.n)$("sg").textContent="Karibu, "+pf.n;$("sp").onclick=()=>{mn=cd=true;fin();};setTimeout(()=>{mn=true;fin();},2400);setTimeout(()=>{cd=true;fin();},5000);cs();cloudInit();})();
</script></body></html>
